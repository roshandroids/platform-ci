name: Node setup
description: Optional Node.js setup for sidecars / tooling

inputs:
  node-version:
    description: Node.js version
    required: false
    default: "22"
  working-directory:
    description: Directory for npm ci if package.json exists
    required: false
    default: .

runs:
  using: composite
  steps:
    - name: Set up Node
      uses: actions/setup-node@v4
      with:
        node-version: ${{ inputs.node-version }}
        cache: npm
        cache-dependency-path: |
          **/package-lock.json
          **/pnpm-lock.yaml

    - name: npm ci (if lockfile)
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: |
        set -euo pipefail
        if [[ -f package-lock.json ]]; then
          npm ci
        elif [[ -f package.json ]]; then
          npm install
        else
          echo "No package.json in ${{ inputs.working-directory }} — Node ready only"
        fi
