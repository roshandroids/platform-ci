name: Read ci.yaml
description: Parse platform-ci config into workflow outputs

inputs:
  config-path:
    description: Path to ci.yaml relative to workspace root
    required: false
    default: ci.yaml

outputs:
  schema:
    value: ${{ steps.parse.outputs.schema }}
  flutter:
    value: ${{ steps.parse.outputs.flutter }}
  kind:
    value: ${{ steps.parse.outputs.kind }}
  paths_json:
    value: ${{ steps.parse.outputs.paths_json }}
  primary_path:
    value: ${{ steps.parse.outputs.primary_path }}
  format:
    value: ${{ steps.parse.outputs.format }}
  analyze:
    value: ${{ steps.parse.outputs.analyze }}
  test:
    value: ${{ steps.parse.outputs.test }}
  coverage:
    value: ${{ steps.parse.outputs.coverage }}
  coverage_threshold:
    value: ${{ steps.parse.outputs.coverage_threshold }}
  enforce_coverage:
    value: ${{ steps.parse.outputs.enforce_coverage }}
  golden:
    value: ${{ steps.parse.outputs.golden }}
  exclude_golden_from_test:
    value: ${{ steps.parse.outputs.exclude_golden_from_test }}
  integration:
    value: ${{ steps.parse.outputs.integration }}
  melos_filter:
    value: ${{ steps.parse.outputs.melos_filter }}
  quality_scripts_json:
    value: ${{ steps.parse.outputs.quality_scripts_json }}
  pr_builds_json:
    value: ${{ steps.parse.outputs.pr_builds_json }}
  main_builds_json:
    value: ${{ steps.parse.outputs.main_builds_json }}
  release_targets_json:
    value: ${{ steps.parse.outputs.release_targets_json }}
  web_args_json:
    value: ${{ steps.parse.outputs.web_args_json }}
  android_args_json:
    value: ${{ steps.parse.outputs.android_args_json }}
  build_config_json:
    value: ${{ steps.parse.outputs.build_config_json }}
  before_build:
    value: ${{ steps.parse.outputs.before_build }}
  node_enabled:
    value: ${{ steps.parse.outputs.node_enabled }}
  node_version:
    value: ${{ steps.parse.outputs.node_version }}
  firebase_enabled:
    value: ${{ steps.parse.outputs.firebase_enabled }}
  firebase_project_id:
    value: ${{ steps.parse.outputs.firebase_project_id }}
  firebase_preview_on_pr:
    value: ${{ steps.parse.outputs.firebase_preview_on_pr }}
  pages_enabled:
    value: ${{ steps.parse.outputs.pages_enabled }}
  pages_source:
    value: ${{ steps.parse.outputs.pages_source }}
  demos_enabled:
    value: ${{ steps.parse.outputs.demos_enabled }}
  demos_manifest:
    value: ${{ steps.parse.outputs.demos_manifest }}
  demos_base_href_prefix:
    value: ${{ steps.parse.outputs.demos_base_href_prefix }}
  pub_enabled:
    value: ${{ steps.parse.outputs.pub_enabled }}
  pub_path:
    value: ${{ steps.parse.outputs.pub_path }}
  pub_dry_run_on_pr:
    value: ${{ steps.parse.outputs.pub_dry_run_on_pr }}

runs:
  using: composite
  steps:
    - name: Parse ci.yaml
      id: parse
      shell: bash
      env:
        CONFIG_PATH: ${{ inputs.config-path }}
      run: |
        set -euo pipefail
        if [[ ! -f "$CONFIG_PATH" ]]; then
          echo "::error::Missing config file: $CONFIG_PATH"
          exit 1
        fi

        ruby -ryaml -rjson -e '
        path = ENV.fetch("CONFIG_PATH")
        cfg = YAML.load_file(path)
        abort("ci.yaml root must be a mapping") unless cfg.is_a?(Hash)
        abort("schema must be 1") unless cfg["schema"] == 1
        flutter = cfg["flutter"]
        abort("flutter is required") if flutter.nil? || flutter.to_s.empty?
        kind = cfg["kind"]
        abort("kind must be app|package|melos|cli") unless %w[app package melos cli].include?(kind)
        paths = cfg["paths"]
        abort("paths must be a non-empty array") unless paths.is_a?(Array) && !paths.empty?

        quality = cfg["quality"].is_a?(Hash) ? cfg["quality"] : {}
        build = cfg["build"].is_a?(Hash) ? cfg["build"] : {}
        hooks = cfg["hooks"].is_a?(Hash) ? cfg["hooks"] : {}
        node = cfg["node"].is_a?(Hash) ? cfg["node"] : {}
        deploy = cfg["deploy"].is_a?(Hash) ? cfg["deploy"] : {}
        firebase = deploy["firebase"].is_a?(Hash) ? deploy["firebase"] : {}
        pages = deploy["pages"].is_a?(Hash) ? deploy["pages"] : {}
        demos = deploy["demos"].is_a?(Hash) ? deploy["demos"] : {}
        publish = cfg["publish"].is_a?(Hash) ? cfg["publish"] : {}
        pub = publish["pub"].is_a?(Hash) ? publish["pub"] : {}

        defaults = {
          "web" => {"args" => ["--release"], "script" => "", "package" => "none"},
          "android" => {"args" => ["appbundle"], "script" => "", "package" => "none"},
          "ios" => {"args" => ["--no-codesign", "--release"], "script" => "", "package" => "none"},
          "macos" => {"args" => ["--release"], "script" => "", "package" => "zip"},
          "windows" => {"args" => ["--release"], "script" => "", "package" => "zip"},
          "linux" => {"args" => ["--release"], "script" => "", "package" => "zip"},
          "cli" => {"args" => [], "script" => "", "package" => "none"}
        }
        build_config = {}
        defaults.each do |target, dflt|
          t = build[target].is_a?(Hash) ? build[target] : {}
          build_config[target] = {
            "args" => t["args"] || dflt["args"],
            "script" => (t["script"] || dflt["script"]).to_s,
            "package" => (t["package"] || dflt["package"]).to_s
          }
        end

        out = ENV.fetch("GITHUB_OUTPUT")
        File.open(out, "a") do |f|
          f.puts "schema=#{cfg["schema"]}"
          f.puts "flutter=#{flutter}"
          f.puts "kind=#{kind}"
          f.puts "paths_json=#{JSON.generate(paths)}"
          f.puts "primary_path=#{paths.first}"
          f.puts "format=#{quality.key?("format") ? !!quality["format"] : true}"
          f.puts "analyze=#{quality.key?("analyze") ? !!quality["analyze"] : true}"
          f.puts "test=#{quality.key?("test") ? !!quality["test"] : true}"
          f.puts "coverage=#{quality.key?("coverage") ? !!quality["coverage"] : false}"
          f.puts "coverage_threshold=#{quality["coverage_threshold"] || 0}"
          f.puts "enforce_coverage=#{quality.key?("enforce_coverage") ? !!quality["enforce_coverage"] : false}"
          f.puts "golden=#{quality.key?("golden") ? !!quality["golden"] : false}"
          f.puts "exclude_golden_from_test=#{quality.key?("exclude_golden_from_test") ? !!quality["exclude_golden_from_test"] : true}"
          f.puts "integration=#{quality.key?("integration") ? !!quality["integration"] : false}"
          f.puts "melos_filter=#{quality["melos_filter"].to_s}"
          f.puts "quality_scripts_json=#{JSON.generate(quality["scripts"] || [])}"
          f.puts "pr_builds_json=#{JSON.generate(cfg["pr_builds"] || [])}"
          f.puts "main_builds_json=#{JSON.generate(cfg["main_builds"] || [])}"
          f.puts "release_targets_json=#{JSON.generate(cfg["release_targets"] || [])}"
          f.puts "web_args_json=#{JSON.generate(build_config["web"]["args"])}"
          f.puts "android_args_json=#{JSON.generate(build_config["android"]["args"])}"
          f.puts "build_config_json=#{JSON.generate(build_config)}"
          f.puts "before_build=#{hooks["before_build"].to_s}"
          f.puts "node_enabled=#{node.key?("enabled") ? !!node["enabled"] : false}"
          f.puts "node_version=#{node["version"] || "22"}"
          f.puts "firebase_enabled=#{firebase.key?("enabled") ? !!firebase["enabled"] : false}"
          f.puts "firebase_project_id=#{firebase["project_id"].to_s}"
          f.puts "firebase_preview_on_pr=#{firebase.key?("preview_on_pr") ? !!firebase["preview_on_pr"] : false}"
          f.puts "pages_enabled=#{pages.key?("enabled") ? !!pages["enabled"] : false}"
          f.puts "pages_source=#{pages["source"] || "web"}"
          f.puts "demos_enabled=#{demos.key?("enabled") ? !!demos["enabled"] : false}"
          f.puts "demos_manifest=#{demos["manifest"] || "showcase/demos.json"}"
          f.puts "demos_base_href_prefix=#{demos["base_href_prefix"] || "/"}"
          f.puts "pub_enabled=#{pub.key?("enabled") ? !!pub["enabled"] : false}"
          f.puts "pub_path=#{pub["path"] || "."}"
          f.puts "pub_dry_run_on_pr=#{pub.key?("dry_run_on_pr") ? !!pub["dry_run_on_pr"] : true}"
        end
        '
