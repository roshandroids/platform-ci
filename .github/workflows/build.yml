name: Build

# Callable: build targets from ci.yaml; upload build-<target>-<sha> (build once).
# Supports web/android/ios/macos/windows/linux/cli + optional custom scripts / zip package.
on:
  workflow_call:
    inputs:
      config-path:
        type: string
        required: false
        default: ci.yaml
      trigger:
        description: pull_request | push | release | workflow_dispatch
        type: string
        required: true
      sha:
        type: string
        required: false
        default: ""

jobs:
  resolve:
    name: Resolve targets
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      targets_json: ${{ steps.pick.outputs.targets_json }}
      flutter: ${{ steps.cfg.outputs.flutter }}
      primary_path: ${{ steps.cfg.outputs.primary_path }}
      build_config_json: ${{ steps.cfg.outputs.build_config_json }}
      before_build: ${{ steps.cfg.outputs.before_build }}
      node_enabled: ${{ steps.cfg.outputs.node_enabled }}
      node_version: ${{ steps.cfg.outputs.node_version }}
      artifact_sha: ${{ steps.pick.outputs.artifact_sha }}
      has_targets: ${{ steps.pick.outputs.has_targets }}
    steps:
      - name: Checkout consumer
        uses: actions/checkout@v4

      - name: Read config
        id: cfg
        uses: roshandroids/platform-ci/.github/actions/read-config@v1
        with:
          config-path: ${{ inputs.config-path }}

      - name: Pick targets
        id: pick
        shell: bash
        env:
          TRIGGER: ${{ inputs.trigger }}
          PR_BUILDS: ${{ steps.cfg.outputs.pr_builds_json }}
          MAIN_BUILDS: ${{ steps.cfg.outputs.main_builds_json }}
          RELEASE_TARGETS: ${{ steps.cfg.outputs.release_targets_json }}
          SHA_INPUT: ${{ inputs.sha }}
          GITHUB_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          case "$TRIGGER" in
            pull_request) targets="$PR_BUILDS" ;;
            push) targets="$MAIN_BUILDS" ;;
            release) targets="$RELEASE_TARGETS" ;;
            workflow_dispatch) targets="$MAIN_BUILDS" ;;
            *)
              echo "::error::Unknown trigger: $TRIGGER"
              exit 1
              ;;
          esac
          sha="${SHA_INPUT:-$GITHUB_SHA}"
          count="$(echo "$targets" | jq 'length')"
          echo "targets_json=$targets" >> "$GITHUB_OUTPUT"
          echo "artifact_sha=$sha" >> "$GITHUB_OUTPUT"
          if [[ "$count" -gt 0 ]]; then
            echo "has_targets=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_targets=false" >> "$GITHUB_OUTPUT"
          fi
          echo "Targets ($TRIGGER): $targets"

  build:
    name: Build (${{ matrix.target }})
    needs: resolve
    if: needs.resolve.outputs.has_targets == 'true'
    runs-on: ${{ matrix.target == 'ios' && 'macos-latest' || matrix.target == 'macos' && 'macos-latest' || matrix.target == 'windows' && 'windows-latest' || 'ubuntu-latest' }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.resolve.outputs.targets_json) }}
    steps:
      - name: Checkout consumer
        uses: actions/checkout@v4

      - name: Node setup
        if: needs.resolve.outputs.node_enabled == 'true'
        uses: roshandroids/platform-ci/.github/actions/node-setup@v1
        with:
          node-version: ${{ needs.resolve.outputs.node_version }}
          working-directory: ${{ needs.resolve.outputs.primary_path }}

      - name: Flutter setup
        uses: roshandroids/platform-ci/.github/actions/flutter-setup@v1
        with:
          flutter-version: ${{ needs.resolve.outputs.flutter }}
          working-directory: ${{ needs.resolve.outputs.primary_path }}

      - name: Before build hook
        if: needs.resolve.outputs.before_build != ''
        shell: bash
        env:
          CMD: ${{ needs.resolve.outputs.before_build }}
        run: |
          set -euo pipefail
          echo "--> $CMD"
          bash -lc "$CMD"

      - name: Build target
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          PRIMARY: ${{ needs.resolve.outputs.primary_path }}
          BUILD_CONFIG_JSON: ${{ needs.resolve.outputs.build_config_json }}
        run: |
          set -euo pipefail
          cfg="$(echo "$BUILD_CONFIG_JSON" | jq -c --arg t "$TARGET" '.[$t]')"
          script="$(echo "$cfg" | jq -r '.script // ""')"
          package="$(echo "$cfg" | jq -r '.package // "none"')"
          args_json="$(echo "$cfg" | jq -c '.args // []')"
          out="${GITHUB_WORKSPACE}/dist/${TARGET}"
          mkdir -p "$out"

          if [[ -n "$script" ]]; then
            echo "Custom build script: $script"
            bash -lc "$script"
            if [[ -z "$(ls -A "$out" 2>/dev/null || true)" ]]; then
              echo "::error::Custom script must populate dist/${TARGET}/"
              exit 1
            fi
            exit 0
          fi

          cd "$PRIMARY"

          case "$TARGET" in
            web)
              # shellcheck disable=SC2046
              flutter build web $(echo "$args_json" | jq -r '.[]')
              cp -R build/web/. "$out/"
              ;;
            android)
              # shellcheck disable=SC2046
              flutter build $(echo "$args_json" | jq -r '.[]')
              if [[ -d build/app/outputs ]]; then
                cp -R build/app/outputs/. "$out/"
              fi
              ;;
            ios)
              # shellcheck disable=SC2046
              flutter build ios $(echo "$args_json" | jq -r '.[]')
              mkdir -p "$out"
              echo "ios-build-ok" > "$out/BUILD_OK"
              if [[ -d build/ios ]]; then
                # Keep lightweight marker; full IPA needs signing (consumer script)
                find build/ios -name '*.app' -maxdepth 5 2>/dev/null | head -5 > "$out/app_paths.txt" || true
              fi
              ;;
            macos)
              # shellcheck disable=SC2046
              flutter build macos $(echo "$args_json" | jq -r '.[]')
              app="$(find build/macos -name '*.app' -type d | head -1 || true)"
              if [[ -z "$app" ]]; then
                echo "::error::No .app found under build/macos"
                exit 1
              fi
              if [[ "$package" == "zip" ]]; then
                name="$(basename "$app" .app)"
                ditto -c -k --sequesterRsrc --keepParent "$app" "$out/${name}-macOS.zip"
              else
                cp -R "$app" "$out/"
              fi
              ;;
            windows)
              # shellcheck disable=SC2046
              flutter build windows $(echo "$args_json" | jq -r '.[]')
              release_dir="build/windows/x64/runner/Release"
              if [[ ! -d "$release_dir" ]]; then
                echo "::error::Missing $release_dir"
                exit 1
              fi
              if [[ "$package" == "zip" ]]; then
                if command -v powershell >/dev/null 2>&1; then
                  powershell -Command "Compress-Archive -Path '$release_dir\\*' -DestinationPath '$out\\app-windows-x64.zip' -Force"
                else
                  (cd "$release_dir" && zip -r "$out/app-windows-x64.zip" .)
                fi
              else
                cp -R "$release_dir/." "$out/"
              fi
              ;;
            linux)
              # shellcheck disable=SC2046
              flutter build linux $(echo "$args_json" | jq -r '.[]')
              bundle="$(find build/linux -type d -name bundle | head -1 || true)"
              if [[ -z "$bundle" ]]; then
                echo "::error::No linux bundle found"
                exit 1
              fi
              if [[ "$package" == "zip" ]]; then
                (cd "$bundle" && zip -r "$out/app-linux.zip" .)
              else
                cp -R "$bundle/." "$out/"
              fi
              ;;
            cli)
              if compgen -G "bin/*.dart" > /dev/null; then
                for entry in bin/*.dart; do
                  name="$(basename "$entry" .dart)"
                  dart compile exe "$entry" -o "$out/${name}"
                done
              else
                echo "::error::cli target requires bin/*.dart or build.cli.script"
                exit 1
              fi
              ;;
            *)
              echo "::error::Unknown target $TARGET"
              exit 1
              ;;
          esac

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: build-${{ matrix.target }}-${{ needs.resolve.outputs.artifact_sha }}
          path: dist/${{ matrix.target }}
          if-no-files-found: error
          retention-days: 7
