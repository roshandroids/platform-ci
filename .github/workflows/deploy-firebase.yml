name: Deploy Firebase

# Callable: deploy pre-built web artifact to Firebase Hosting (no rebuild).
on:
  workflow_call:
    inputs:
      config-path:
        type: string
        required: false
        default: ci.yaml
      artifact-sha:
        description: SHA used in artifact name build-web-<sha>
        type: string
        required: true
      channel-id:
        description: Firebase Hosting channel (live or pr-N)
        type: string
        required: false
        default: live
      entry-point:
        description: Directory containing firebase.json
        type: string
        required: false
        default: .
    secrets:
      FIREBASE_SERVICE_ACCOUNT:
        required: true

jobs:
  deploy:
    name: Firebase Hosting
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout consumer
        uses: actions/checkout@v7

      - name: Read config
        id: cfg
        uses: roshandroids/platform-ci/.github/actions/read-config@v1
        with:
          config-path: ${{ inputs.config-path }}

      - name: Guard enabled
        if: steps.cfg.outputs.firebase_enabled != 'true'
        shell: bash
        run: |
          echo "::error::deploy.firebase.enabled is false in ci.yaml"
          exit 1

      - name: Require project id
        if: steps.cfg.outputs.firebase_project_id == ''
        shell: bash
        run: |
          echo "::error::deploy.firebase.project_id missing in ci.yaml"
          exit 1

      - name: Download web artifact
        uses: actions/download-artifact@v8
        with:
          name: build-web-${{ inputs.artifact-sha }}
          path: _web_artifact

      - name: Stage Hosting public dir
        shell: bash
        env:
          ENTRY: ${{ inputs.entry-point }}
        run: |
          set -euo pipefail
          public="build/web"
          if [[ -f "${ENTRY}/firebase.json" ]]; then
            public="$(ruby -rjson -e "puts JSON.parse(File.read('${ENTRY}/firebase.json')).dig('hosting','public') || 'build/web'")"
          fi
          mkdir -p "${ENTRY}/${public}"
          find "${ENTRY}/${public}" -mindepth 1 -maxdepth 1 -exec rm -rf {} +
          cp -R _web_artifact/. "${ENTRY}/${public}/"
          echo "Staged artifact → ${ENTRY}/${public}"

      - name: Deploy
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ github.token }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          channelId: ${{ inputs.channel-id }}
          projectId: ${{ steps.cfg.outputs.firebase_project_id }}
          entryPoint: ${{ inputs.entry-point }}
