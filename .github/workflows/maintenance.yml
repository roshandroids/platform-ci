name: Maintenance

# Lightweight hygiene. Prefer Dependabot for action bumps.
on:
  workflow_call:
    inputs:
      config-path:
        type: string
        required: false
        default: ci.yaml
  workflow_dispatch:
  schedule:
    - cron: "0 12 * * 0"

jobs:
  hygiene:
    name: Hygiene
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Detect ci.yaml
        id: check
        shell: bash
        run: |
          set -euo pipefail
          path="ci.yaml"
          if [[ -f "$path" ]]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
            echo "config_path=$path" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No ci.yaml — maintenance no-op (OK for platform-ci itself)."
          fi

      - name: Read config
        if: steps.check.outputs.present == 'true'
        id: cfg
        uses: roshandroids/platform-ci/.github/actions/read-config@v1
        with:
          config-path: ${{ steps.check.outputs.config_path }}

      - name: Flutter setup
        if: steps.check.outputs.present == 'true'
        uses: roshandroids/platform-ci/.github/actions/flutter-setup@v1
        with:
          flutter-version: ${{ steps.cfg.outputs.flutter }}
          working-directory: ${{ steps.cfg.outputs.primary_path }}

      - name: Outdated report
        if: steps.check.outputs.present == 'true'
        shell: bash
        working-directory: ${{ steps.cfg.outputs.primary_path }}
        run: dart pub outdated || true
