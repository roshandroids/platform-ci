name: Quality

# Callable: format / analyze / test (+ optional golden, integration, custom scripts)
on:
  workflow_call:
    inputs:
      config-path:
        description: Path to ci.yaml
        type: string
        required: false
        default: ci.yaml

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout consumer
        uses: actions/checkout@v4

      - name: Read config
        id: cfg
        uses: roshandroids/platform-ci/.github/actions/read-config@v1
        with:
          config-path: ${{ inputs.config-path }}

      - name: Flutter setup
        uses: roshandroids/platform-ci/.github/actions/flutter-setup@v1
        with:
          flutter-version: ${{ steps.cfg.outputs.flutter }}
          working-directory: ${{ steps.cfg.outputs.primary_path }}
          pub-get: ${{ steps.cfg.outputs.kind == 'melos' && 'false' || 'true' }}

      - name: Melos bootstrap
        if: steps.cfg.outputs.kind == 'melos'
        uses: roshandroids/platform-ci/.github/actions/melos-bootstrap@v1
        with:
          filter: ${{ steps.cfg.outputs.melos_filter }}

      - name: Format
        if: steps.cfg.outputs.format == 'true'
        shell: bash
        env:
          KIND: ${{ steps.cfg.outputs.kind }}
          PATHS_JSON: ${{ steps.cfg.outputs.paths_json }}
          MELOS_FILTER: ${{ steps.cfg.outputs.melos_filter }}
        run: |
          set -euo pipefail
          if [[ "$KIND" == "melos" ]]; then
            if [[ -n "$MELOS_FILTER" ]]; then
              melos exec --scope="$MELOS_FILTER" -- dart format --set-exit-if-changed .
            else
              melos exec -- dart format --set-exit-if-changed .
            fi
          else
            echo "$PATHS_JSON" | jq -r '.[]' | while read -r p; do
              (cd "$p" && dart format --set-exit-if-changed .)
            done
          fi

      - name: Analyze
        if: steps.cfg.outputs.analyze == 'true'
        shell: bash
        env:
          KIND: ${{ steps.cfg.outputs.kind }}
          PATHS_JSON: ${{ steps.cfg.outputs.paths_json }}
          MELOS_FILTER: ${{ steps.cfg.outputs.melos_filter }}
        run: |
          set -euo pipefail
          if [[ "$KIND" == "melos" ]]; then
            if [[ -n "$MELOS_FILTER" ]]; then
              melos exec --scope="$MELOS_FILTER" -- flutter analyze --fatal-infos
            else
              melos exec -- flutter analyze --fatal-infos
            fi
          else
            echo "$PATHS_JSON" | jq -r '.[]' | while read -r p; do
              (cd "$p" && flutter analyze --fatal-infos)
            done
          fi

      - name: Test
        if: steps.cfg.outputs.test == 'true'
        shell: bash
        env:
          KIND: ${{ steps.cfg.outputs.kind }}
          PATHS_JSON: ${{ steps.cfg.outputs.paths_json }}
          MELOS_FILTER: ${{ steps.cfg.outputs.melos_filter }}
          COVERAGE: ${{ steps.cfg.outputs.coverage }}
          GOLDEN: ${{ steps.cfg.outputs.golden }}
          EXCLUDE_GOLDEN: ${{ steps.cfg.outputs.exclude_golden_from_test }}
        run: |
          set -euo pipefail
          test_args=()
          if [[ "$COVERAGE" == "true" ]]; then
            test_args+=(--coverage)
          fi
          if [[ "$GOLDEN" == "true" && "$EXCLUDE_GOLDEN" == "true" ]]; then
            test_args+=(--exclude-tags=golden)
          fi
          if [[ "$KIND" == "melos" ]]; then
            if [[ -n "$MELOS_FILTER" ]]; then
              melos exec --scope="$MELOS_FILTER" -- flutter test "${test_args[@]}"
            else
              melos exec -- flutter test "${test_args[@]}"
            fi
          else
            echo "$PATHS_JSON" | jq -r '.[]' | while read -r p; do
              (cd "$p" && flutter test "${test_args[@]}")
            done
          fi

      - name: Golden tests
        if: steps.cfg.outputs.golden == 'true'
        shell: bash
        env:
          KIND: ${{ steps.cfg.outputs.kind }}
          PATHS_JSON: ${{ steps.cfg.outputs.paths_json }}
          MELOS_FILTER: ${{ steps.cfg.outputs.melos_filter }}
        run: |
          set -euo pipefail
          if [[ "$KIND" == "melos" ]]; then
            if [[ -n "$MELOS_FILTER" ]]; then
              melos exec --scope="$MELOS_FILTER" -- flutter test --tags=golden
            else
              melos exec -- flutter test --tags=golden
            fi
          else
            echo "$PATHS_JSON" | jq -r '.[]' | while read -r p; do
              (cd "$p" && flutter test --tags=golden)
            done
          fi

      - name: Integration tests
        if: steps.cfg.outputs.integration == 'true'
        shell: bash
        working-directory: ${{ steps.cfg.outputs.primary_path }}
        run: |
          set -euo pipefail
          if [[ -d integration_test ]]; then
            flutter test integration_test
          else
            echo "::warning::integration enabled but integration_test/ missing"
          fi

      - name: Custom quality scripts
        if: steps.cfg.outputs.quality_scripts_json != '[]'
        shell: bash
        env:
          SCRIPTS_JSON: ${{ steps.cfg.outputs.quality_scripts_json }}
        run: |
          set -euo pipefail
          echo "$SCRIPTS_JSON" | jq -r '.[]' | while read -r cmd; do
            echo "--> $cmd"
            bash -lc "$cmd"
          done

      - name: Coverage note
        if: steps.cfg.outputs.coverage == 'true'
        shell: bash
        env:
          ENFORCE: ${{ steps.cfg.outputs.enforce_coverage }}
          THRESHOLD: ${{ steps.cfg.outputs.coverage_threshold }}
        run: |
          set -euo pipefail
          echo "Coverage data collected under **/coverage (if tests wrote it)."
          if [[ "$ENFORCE" == "true" ]]; then
            echo "::warning::enforce_coverage is true — consumer should gate via quality.scripts (lcov). Platform does not parse lcov in v1.1."
            echo "threshold configured: $THRESHOLD"
          fi
