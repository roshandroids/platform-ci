name: Release

# Callable: download build-* artifacts from this run → GitHub Release.
# Must run in same workflow run as build.yml (artifact sharing).
on:
  workflow_call:
    inputs:
      config-path:
        type: string
        required: false
        default: ci.yaml
      tag:
        description: Release tag (vX.Y.Z)
        type: string
        required: true
      artifact-sha:
        description: SHA used in build-<target>-<sha> artifact names
        type: string
        required: true
      body:
        description: Optional release notes
        type: string
        required: false
        default: ""
    permissions:
      contents: write

jobs:
  release:
    name: GitHub Release
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout consumer
        uses: actions/checkout@v4

      - name: Download build artifacts
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          pattern: build-*-${{ inputs.artifact-sha }}
          path: dist
          merge-multiple: false

      - name: Collect release assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-assets
          if [[ -d dist ]]; then
            find dist -type f -exec cp {} release-assets/ \;
          fi
          echo "Assets:"
          ls -la release-assets || true

      - name: Publish GitHub Release
        uses: roshandroids/platform-ci/.github/actions/github-release@v1
        with:
          tag: ${{ inputs.tag }}
          name: ${{ inputs.tag }}
          body: ${{ inputs.body }}
          artifact-dir: release-assets
