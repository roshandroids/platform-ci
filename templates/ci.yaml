# Minimal defaults — everything expensive is OFF / empty until you opt in.
schema: 1

flutter: "3.38.9"
kind: app

paths:
  - .

# Opt-in Node sidecar (AI Tray, etc.)
node:
  enabled: false
  version: "22"

# Toggle each gate. False = skipped (no minutes).
quality:
  format: true
  analyze: true
  test: true
  coverage: false
  golden: false
  integration: false
  scripts: []

# Builds are opt-in lists. Empty = do not call build.yml (or it no-ops).
pr_builds: []
main_builds: []
release_targets: []

# Only matters for targets you listed above.
build:
  web:
    args:
      - "--release"

# All deploy sinks default off — separate caller workflows when enabled.
deploy:
  firebase:
    enabled: false
    project_id: ""
  pages:
    enabled: false
  demos:
    enabled: false
  showcase:
    enabled: false

publish:
  pub:
    enabled: false

hooks:
  local: true
  before_build: ""
