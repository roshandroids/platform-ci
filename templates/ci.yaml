schema: 1

flutter: "3.38.9"
kind: app

paths:
  - .

node:
  enabled: false
  version: "22"

quality:
  format: true
  analyze: true
  test: true
  coverage: false
  golden: false
  integration: false
  scripts: []

pr_builds: []
main_builds:
  - web
release_targets:
  - web

build:
  web:
    args:
      - "--release"
  macos:
    package: zip
  windows:
    package: zip

deploy:
  firebase:
    enabled: false
    project_id: ""
    on:
      - main
    preview_on_pr: false
  pages:
    enabled: false
    on:
      - main
    source: web
  demos:
    enabled: false
    manifest: showcase/demos.json
    base_href_prefix: /

publish:
  pub:
    enabled: false
    path: .
    dry_run_on_pr: true

hooks:
  local: true
  before_build: ""
