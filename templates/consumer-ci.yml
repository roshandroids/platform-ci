# Thin consumer workflow — quality only by default.
# Copy to .github/workflows/ci.yml
# Add build/deploy/release as separate workflows only when ci.yaml enables them.
name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    uses: roshandroids/platform-ci/.github/workflows/quality.yml@v1
    with:
      config-path: ci.yaml

  # OPTIONAL — include only if pr_builds or main_builds is non-empty in ci.yaml.
  # Empty lists → build workflow still starts a resolve job (wastes minutes).
  # Prefer templates/consumer-ci-with-build.yml when you need builds.
