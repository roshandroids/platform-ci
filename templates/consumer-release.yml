# Optional: tag release + attach artifacts. Copy to .github/workflows/release.yml
name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    uses: OWNER/platform-ci/.github/workflows/build.yml@v1
    with:
      config-path: ci.yaml
      trigger: release
      sha: ${{ github.sha }}

  release:
    needs: build
    uses: OWNER/platform-ci/.github/workflows/release.yml@v1
    with:
      config-path: ci.yaml
      tag: ${{ github.ref_name }}
      artifact-sha: ${{ github.sha }}
