# Tag publish — build then release (same run).
# Version + CHANGELOG land earlier via a Release PR (see docs/RELEASE.md).
# Copy to .github/workflows/release.yml — replace OWNER.
name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

# Intentional: rebuild on tag (simple). Do not fetch Release PR artifacts.
jobs:
  build:
    uses: roshandroids/platform-ci/.github/workflows/build.yml@v1
    with:
      config-path: ci.yaml
      trigger: release
      sha: ${{ github.sha }}

  release:
    needs: build
    uses: roshandroids/platform-ci/.github/workflows/release.yml@v1
    with:
      config-path: ci.yaml
      tag: ${{ github.ref_name }}
      artifact-sha: ${{ github.sha }}
